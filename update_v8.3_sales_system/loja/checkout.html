<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col items-center pt-8">

    <div class="w-full max-w-md px-6">
        <!-- HEADER -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-slate-900">Resumo do Pedido</h1>
            <p class="text-slate-500 text-sm">Vitalício • Sem mensalidade</p>
        </div>

        <!-- PRODUCT CARD -->
        <div class="bg-white rounded-2xl p-6 shadow-xl shadow-slate-200/50 border border-slate-100 mb-6">
            <div class="flex items-center gap-4 mb-4">
                <div id="prod-icon"
                    class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="box" class="w-6 h-6"></i>
                </div>
                <div>
                    <h3 class="font-bold text-lg" id="prod-name">Carregando...</h3>
                    <p class="text-xs text-slate-400 font-medium">Licença Premium</p>
                </div>
            </div>

            <div class="h-px bg-slate-100 my-4"></div>

            <div class="flex justify-between items-center mb-2">
                <span class="text-slate-500 text-sm">Preço Original</span>
                <span class="text-slate-400 line-through decoration-red-400 decoration-2">R$ 97,00</span>
            </div>

            <div class="flex justify-between items-end">
                <span class="text-slate-900 font-bold">Total</span>
                <div class="text-right">
                    <div class="text-3xl font-black text-slate-900" id="final-price">R$ 47,90</div>
                    <div id="discount-badge"
                        class="hidden text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded-full inline-block">
                        DESCONTO APLICADO
                    </div>
                </div>
            </div>
        </div>

        <!-- COUPON -->
        <div class="mb-8">
            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 block">Cupom de
                Desconto</label>
            <div class="flex gap-2">
                <input type="text" id="coupon-code" placeholder="Código do Parceiro"
                    class="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-3 font-bold uppercase placeholder-slate-300 focus:ring-2 focus:ring-slate-900 focus:border-transparent outline-none transition-all">
                <button onclick="validateCoupon()"
                    class="bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold px-4 rounded-xl transition-colors">
                    Aplicar
                </button>
            </div>
            <p id="coupon-msg" class="text-xs mt-2 font-medium hidden"></p>
        </div>

        <!-- MERCADO PAGO CTA -->
        <button onclick="finishOrder()"
            class="w-full bg-[#009EE3] hover:bg-[#008CC9] text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-blue-500/20 active:scale-95 transition-all flex items-center justify-center gap-3">
            <i data-lucide="credit-card" class="w-6 h-6"></i>
            Pagar com Pix ou Cartão
        </button>
        <p class="text-center text-xs text-slate-400 mt-4 px-8">
            Pagamento seguro via Mercado Pago. Liberação imediata.<br>
            Suporte: (12) 99219-1018
        </p>

    </div>

    <script>
        lucide.createIcons();

        // CONFIG
        const PRODUCTS = {
            'motorista': { name: 'Gestão Motorista', price: 47.90, icon: 'car-taxi-front', color: 'emerald' },
            'motoboy': { name: 'Gestão Motoboy', price: 47.90, icon: 'bike', color: 'orange' }
        };

        const params = new URLSearchParams(window.location.search);
        const prodKey = params.get('product') || 'motorista';
        const product = PRODUCTS[prodKey] || PRODUCTS['motorista'];

        // SETUP UI
        document.getElementById('prod-name').innerText = product.name;
        document.getElementById('prod-icon').className = `w-12 h-12 bg-${product.color}-100 text-${product.color}-600 rounded-xl flex items-center justify-center`;
        document.querySelector('#prod-icon i').setAttribute('data-lucide', product.icon);
        lucide.createIcons();

        let activeCoupon = null;
        let finalPrice = product.price;

        async function validateCoupon() {
            const code = document.getElementById('coupon-code').value.toUpperCase();
            if (!code) return;

            const btn = document.querySelector('button[onclick="validateCoupon()"]');
            btn.innerText = '...';

            try {
                const res = await fetch('../api_vendas.php?action=validate_coupon', {
                    method: 'POST',
                    body: JSON.stringify({ code })
                });
                const data = await res.json();

                const msgEl = document.getElementById('coupon-msg');
                const priceEl = document.getElementById('final-price');
                const badgeEl = document.getElementById('discount-badge');

                if (data.valid) {
                    activeCoupon = { code: code, discount: data.discount_percent };

                    // Calc new price
                    finalPrice = product.price * (1 - (data.discount_percent / 100));

                    priceEl.innerText = finalPrice.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                    msgEl.innerText = `Cupom "${code}" aplicado! ${data.discount_percent}% OFF.`;
                    msgEl.className = 'text-xs mt-2 font-bold text-green-600';
                    msgEl.classList.remove('hidden');
                    badgeEl.classList.remove('hidden');
                } else {
                    activeCoupon = null;
                    finalPrice = product.price;
                    priceEl.innerText = finalPrice.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                    msgEl.innerText = 'Cupom inválido ou expirado.';
                    msgEl.className = 'text-xs mt-2 font-bold text-red-500';
                    msgEl.classList.remove('hidden');
                    badgeEl.classList.add('hidden');
                }
            } catch (e) {
                console.error(e);
            } finally {
                btn.innerText = 'Aplicar';
            }
        }

        async function finishOrder() {
            const btn = document.querySelector('button[onclick="finishOrder()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Gerando Pagamento...';
            btn.disabled = true;

            try {
                // Prepara dados para API
                const payload = {
                    action: 'create_preference',
                    product: prodKey,
                    price: finalPrice,
                    coupon_code: activeCoupon ? activeCoupon.code : ''
                };

                const res = await fetch('../api_vendas.php', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.status === 'success') {
                    // Redireciona para o Checkout do Mercado Pago
                    window.location.href = data.init_point;
                } else {
                    alert('Erro ao gerar pagamento: ' + (data.message || 'Tente novamente.'));
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }

            } catch (e) {
                console.error(e);
                alert('Erro de conexão. Verifique sua internet.');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>

</body>

</html>
